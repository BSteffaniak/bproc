[workspace]
resolver = "2"
members = ["bproc", "bproc-common", "xtask"]
# bproc-ebpf must be excluded because it targets bpfel-unknown-none (no_std)
# and cannot be built with the workspace's default target
# It shares workspace dependencies via its own Cargo.toml
exclude = ["bproc-ebpf"]

[workspace.dependencies]
aya = { version = "0.13", features = ["async_tokio"] }
aya-ebpf = "0.1"
aya-log-ebpf = "0.1"
bproc-common = { path = "bproc-common", default-features = false }

[profile.dev]
opt-level = 3

[profile.release]
lto = true
opt-level = 3

# Local bmux development checkout; replace with the pushed git revision before release.
[patch."https://github.com/BSteffaniak/bmux"]
bmux_tui = { path = "/Volumes/ehdd/GitHub/bmux/packages/tui" }
bmux_tui_components = { path = "/Volumes/ehdd/GitHub/bmux/packages/tui-components" }
bmux_tui_runtime = { path = "/Volumes/ehdd/GitHub/bmux/packages/tui-runtime" }
bmux_keyboard = { path = "/Volumes/ehdd/GitHub/bmux/packages/keyboard" }
bmux_text_edit = { path = "/Volumes/ehdd/GitHub/bmux/packages/text-edit" }
